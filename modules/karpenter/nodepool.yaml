apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # Use spot instances — up to 62% cheaper than on-demand
        # t3.medium spot ≈ $0.016/hr in us-east-1
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]

        # Lock to x86_64 only — AL2023 AMI is x86
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]

        # Only allow t3.small and t3.medium for home lab
        # t3.small  = 2 vCPU, 2GB RAM — ~$0.008/hr spot
        # t3.medium = 2 vCPU, 4GB RAM — ~$0.016/hr spot
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values: ["t3.small", "t3.medium"]

  # Hard cap — Karpenter will NEVER exceed this across all nodes it manages
  # 4 CPU and 8Gi is enough for learning workloads
  # Prevents accidental runaway scaling
  limits:
    cpu: 4
    memory: 8Gi

  disruption:
    # Consolidate unused nodes aggressively — saves cost
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
